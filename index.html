<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة النتائج | لوحة أكاديمية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-3 py-lg-4">
    <header class="topbar mb-4">
      <div>
        <p class="eyebrow mb-1">الإدارة الأكاديمية</p>
        <h1 class="h3 mb-0">نظام إدارة النتائج</h1>
      </div>
      <div class="status-badge" title="تُحفظ البيانات في هذا المتصفح فقط">
        <span class="status-dot"></span>
        <span id="storageStatus">الحفظ على هذا الجهاز</span>
      </div>
    </header>

    <div class="row g-4">
      <section class="col-lg-5">
        <div class="panel h-100">
          <div class="panel-heading">
            <span class="section-icon"><i class="bi bi-person-plus"></i></span>
            <div>
              <p class="section-kicker mb-1">بيانات جديدة</p>
              <h2 class="h5 mb-0">إضافة طالب</h2>
            </div>
          </div>

          <form id="studentForm" novalidate>
            <div class="mb-3">
              <label for="studentName" class="form-label">اسم الطالب</label>
              <input type="text" class="form-control" id="studentName" placeholder="أدخل اسم الطالب">
            </div>

            <div class="row g-3">
              <div class="col-md-4">
                <label for="grade1" class="form-label">المادة الأولى</label>
                <input type="number" class="form-control" id="grade1" min="0" max="100" placeholder="0 - 100">
              </div>
              <div class="col-md-4">
                <label for="grade2" class="form-label">المادة الثانية</label>
                <input type="number" class="form-control" id="grade2" min="0" max="100" placeholder="0 - 100">
              </div>
              <div class="col-md-4">
                <label for="grade3" class="form-label">المادة الثالثة</label>
                <input type="number" class="form-control" id="grade3" min="0" max="100" placeholder="0 - 100">
              </div>
            </div>

            <div class="mt-3">
              <label for="attendance" class="form-label">نسبة الحضور</label>
              <div class="input-group">
                <input type="number" class="form-control" id="attendance" min="0" max="100" placeholder="0 - 100">
                <span class="input-group-text">%</span>
              </div>
            </div>

            <div id="errorBox" class="alert alert-danger mt-3 d-none" role="alert"></div>
            <div id="successBox" class="alert alert-success mt-3 d-none" role="status"></div>

            <button type="submit" id="addStudentBtn" class="btn btn-primary w-100 mt-3">
              <i class="bi bi-plus-lg me-1"></i>
              إضافة طالب
            </button>
          </form>

          <button type="button" id="mercyBtn" class="btn btn-mercy w-100 mt-3">
            <i class="bi bi-stars me-1"></i>
            تفعيل لجنة الرأفة
          </button>
        </div>
      </section>

      <section class="col-lg-7">
        <div class="panel mb-4">
          <div class="student-list-header d-flex align-items-center justify-content-between mb-3">
            <div class="panel-heading compact">
              <span class="section-icon"><i class="bi bi-people"></i></span>
              <h2 class="h5 mb-0">قائمة الطلاب</h2>
            </div>
            <div class="student-actions">
              <button type="button" id="exportBackupBtn" class="btn btn-secondary-action" disabled>
                <i class="bi bi-download"></i>
                تصدير نسخة
              </button>
              <button type="button" id="importBackupBtn" class="btn btn-secondary-action">
                <i class="bi bi-upload"></i>
                استيراد نسخة
              </button>
              <input type="file" id="backupFileInput" accept=".json,application/json" hidden>
              <button type="button" id="clearStudentsBtn" class="btn btn-clear" disabled>
                <i class="bi bi-trash3"></i>
                مسح الكل
              </button>
              <span id="studentCount" class="count-badge">0 طلاب</span>
            </div>
          </div>
          <div id="studentsList" class="students-list">
            <p class="empty-state mb-0">لا يوجد طلاب مضافون حتى الآن.</p>
          </div>
        </div>

        <div class="panel report-panel">
          <div class="panel-heading compact mb-3">
            <span class="section-icon"><i class="bi bi-clipboard-data"></i></span>
            <h2 class="h5 mb-0">التقرير النهائي</h2>
          </div>
          <div id="reportBox" class="report-box">
            <p class="empty-state mb-0">فعّل لجنة الرأفة لإنشاء التقرير.</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
